name: Starter checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: starter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install locked Website dependencies
        run: npm ci
      - name: Verify Website migrations and API on local D1
        run: npm run test:d1
      - name: Verify Sites Worker public reads on local D1
        run: npm run test:sites:d1
      - name: Check starter repository
        run: node scripts/check.mjs
      - name: Validate local research schema and synthetic mappings
        run: python3 -B -m unittest discover -s tests -v
      - name: Check Website formatting
        run: npm run format:check
      - name: Lint Website
        run: npm run lint
      - name: Type-check Website
        run: npm run typecheck
      - name: Test Website
        run: npm test
      - name: Build Website
        run: npm run build
